# V21: shading split into luminance and unit-luminance chroma, I = A * (S_lum * C) + R.
# The next model of the project (not trained yet). Initialised from the base CIAI model,
# trained on Hypersim, InteriorVerse, MID pairs and 3D-Front-IID v2 coloured-light pairs.
model:
  version: 21
  dino_variant: large
  dino_pretrained: true
  dpt_feat_ch: 512
  dpt_fusion_ch: 256
  dpt_out_ch: 256
  detail_ch: 64
  head_mid: 128
  log_shading_limit: 6.0
  log_chroma_limit: 2.5
  canonical_max: 4.0
  observable_low: 0.01
  observable_high: 0.985

train:
  # Three heads plus a paired forward fit conservatively on one 24 GB GPU.
  batch_size: 1
  input_size: 512
  num_workers: 4
  grad_accum_steps: 16
  grad_clip_max_norm: 1.0
  lr: 2.0e-5
  weight_decay: 1.0e-4
  max_iterations: 40000
  log_interval: 50
  val_interval_iters: 1000
  checkpoint_interval_iters: 1000
  max_val_batches: 8
  seed: 42
  amp: true
  # Shape-compatible weights come from the base CIAI model (Table A, row 4): encoder,
  # DPT trunk and albedo head. The albedo head's skip now receives I / (S_lum * C) instead
  # of the gamma-encoded input; the luminance and chroma heads start fresh.
  init_checkpoint: checkpoints/v17_44/checkpoint_iter_40000.pth
  albedo_freeze_steps: 0
  sampling_weights:
    hypersim: 0.30
    interiorverse: 0.15
    midintrinsic: 0.25
    front3d_v2: 0.30

data:
  hypersim_root: ../datasets/hypersim
  hypersim_split_file: hypersim_split.json
  hypersim_strict_split: false
  interiorverse_root: ../datasets/IndoorInverseRendering/interiorverse/interiorverse/interverse
  midintrinsic_root: ../datasets/MIDIntrinsics
  front3d_v2_root: ../datasets/front3d_iid_v2
  cache_max_items: 64

loss:
  lambda_albedo: 1.0
  lambda_albedo_grad: 0.5
  lambda_albedo_ssim: 0.2
  lambda_shading_lum: 1.0
  lambda_shading_lum_grad: 0.5
  lambda_shading_chroma: 1.0
  lambda_shading_chroma_grad: 0.25
  lambda_ordinal: 0.5
  lambda_diffuse: 1.0
  lambda_residual: 0.25
  lambda_edge_ownership: 0.3
  # CIAI pair terms (losses/ciai.py). The chroma term only sees pairs whose measured
  # illuminant chromaticity gap reaches chr_explain_min_gap.
  lambda_invariance: 0.5
  lambda_lum_explain: 0.25
  lambda_chr_explain: 0.25
  chr_explain_min_gap: 0.08

output:
  checkpoint_dir: checkpoints/v21
  log_dir: logs/v21
