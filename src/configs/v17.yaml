# V17 + CIAI: the reported model and training recipe. Experiment configs extend this.
#
# Model: frozen DINOv2-L encoder, DPT decoder, albedo head with the colour path (RGB skip),
# three-channel inverse-shading head, analytic residual.
# Curriculum (global steps):
#   phase 1 [0, 15k)    Hypersim                     supervised only
#   phase 2 [15k, 19k)  Hypersim + InteriorVerse      supervised only (19k = shared fork)
#   phase 3 [19k, 40k)  + MID cross-illumination pairs, CIAI losses on
model:
  version: 17
  dino_variant: large        # small | base | large
  dino_pretrained: true
  dpt_feat_ch: 512
  dpt_fusion_ch: 256
  dpt_out_ch: 256
  detail_ch: 64
  head_mid: 128
  pi_floor: 5.0e-3           # pi clamp floor -> S_d <= ~199
  # Colour path: gamma-encoded input concatenated into the albedo head. Without it the
  # frozen-encoder model keeps about half of the reference chroma spread.
  albedo_rgb_skip: true
  backbone_lr_multiplier: 1.0   # DINOv2 is frozen, so there is no backbone group

train:
  batch_size: 4
  input_size: 512            # DINOv2 sees 504 (36x36 tokens)
  num_workers: 4
  lr: 2.0e-4
  grad_accum_steps: 8        # effective batch 32
  grad_clip_max_norm: 1.0
  use_cosine_lr: true
  phase1_iterations: 15000
  phase2_iterations: 19000
  extend_iterations: 40000
  sampling_weights_phase1:
    hypersim: 1.0
    midintrinsic: 0.0
    interiorverse: 0.0
  sampling_weights_phase2:
    hypersim: 0.6
    midintrinsic: 0.0
    interiorverse: 0.4
  # Synthetic data stays the majority in phase 3 so absolute albedo colour keeps being
  # anchored while the CIAI terms act on the MID pairs.
  sampling_weights_phase3:
    hypersim: 0.4
    midintrinsic: 0.3
    interiorverse: 0.3
  reset_lr: false
  skip_optimizer: false
  log_interval: 500
  val_interval_iters: 2500
  checkpoint_interval_iters: 1000
  val_example_images: 3
  val_example_indices: [0, 20, 40]
  max_val_batches: 10
  compute_val_losses: true
  seed: 42
  # Seeding fixes data order, augmentation and init. Deterministic kernels cost throughput
  # and were not used for any reported run.
  deterministic: false

data:
  hypersim_root: '../datasets/hypersim'
  midintrinsic_root: '../datasets/MIDIntrinsics'
  interiorverse_root: '../datasets/IndoorInverseRendering/interiorverse/interiorverse/interverse'
  hypersim_strict_split: false
  # MID emits a second flash direction of the same scene (rgb2) for the CIAI terms.
  use_mid_paired: true
  # Keep the pair frame un-white-balanced, so the small bounce-colour difference between
  # flash directions survives. The supervised frame stays white-balanced (matches the
  # pseudo-GT albedo).
  mid_raw_color_pair: true

loss:
  # Albedo (all datasets): MSE + multi-scale gradient + DSSIM + chroma-direction L1
  lambda_a: 1.0
  lambda_dssim: 0.2
  lambda_msg_albedo: 0.5
  lambda_a_chroma: 0.2       # part of the colour path: makes desaturation expensive
  # Shading (Hypersim only): scale-and-shift-invariant MSE in the pi domain
  lambda_s: 1.0
  ssi_warmup_iters: 3000
  lambda_msg_shading: 0.5
  # Two-sided diffuse reconstruction A*S_d vs A_gt*S_d_gt (Hypersim only)
  recon_mode: diffuse
  lambda_recon: 1.0
  lambda_msg_recon: 0.25
  # DINOv2-gated within-material chroma consistency (GT-free)
  lambda_mat_consist: 0.05
  mat_sim_threshold: 0.0
  # CIAI pair terms (losses/ciai.py)
  lambda_alb_invariance: 0.5
  lambda_explain: 0.25       # luminance explanation
  # Shading sign prior: relu(A*S_d - I)
  lambda_shade_sign: 0.05
  # Residual: L1 to target (R* = 0 on MID away from speculars) + sparsity
  lambda_r: 0.5
  lambda_res_sparse: 0.02
  lambda_msg_residual: 0.0
