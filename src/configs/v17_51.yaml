# V17.51 -- Phase B TREATMENT arm. Identical to v17_50 except the two colour levers.
#
# See v17_50.yaml for the full rationale, the Phase A measurement that motivates this,
# and the LR-confound note. This file documents only what differs.
#
# LEVER 1 -- mid_chroma_stratified_pairs
#   Weight the flash-pair draw by the REAL measured gap between the two frames' gray
#   probes, instead of drawing uniformly (midintrinsic_dataset.py:211). Adds no
#   synthetic assumption; it only re-weights evidence already in the corpus.
#   Measured over 8 train scenes (src/data/mid_illuminant.py):
#       median pair gap   0.038 -> 0.098   (2.6x)
#       pairs >= 0.08       27% -> 61%     (2.3x)
#   `floor` keeps every pair reachable, so pure direction/intensity pairs are still
#   seen -- dropping them would trade one blind spot for another.
#
# LEVER 2 -- mid_per_direction_tint
#   Give the RAW pair frame a lamp colour from a CALIBRATED blackbody distribution.
#   This is NOT the legacy chromatic_aug, which regressed indoor-ARAP Cast_RMS
#   0.035 -> 0.078. Two things differ, and both were the stated cause of that failure:
#     (a) distribution -- 3000-6000 K, chosen by sweeping the induced pair-gap
#         distribution against V21 §4.4's 0.08-0.20 band (median 0.099). The legacy
#         U[0.6,1.4]^3 box was never checked this way; 2200-10000 K would give p90
#         0.447, more extreme than any measured corpus.
#     (b) application point -- applied to the RAW frame, so it compounds with the real
#         bounce colour raw_color_pair preserves, rather than replacing it on an
#         already-white-balanced frame.
#   Applied ONLY to rgb2. The supervised primary must stay consistent with the WB'd
#   pseudo-GT albedo.exr, or the absolute albedo loss fights the augmentation.
#
#   DISPROVED, and recorded so it is not re-attempted: mixing several tinted
#   directions does NOT create spatially-varying cast. Spatial std of the pair chroma
#   difference is 0.0204 for a 3-direction mix vs 0.0233 for a single global tint
#   (0.88x, LOWER) -- mixing averages the shading and destroys the very footprints the
#   argument relied on. Hence dirs: 1.
#
# TENSION WITH THE COVERAGE FINDING (raised against this config, not by it)
# ------------------------------------------------------------------------
# The v1-vs-v2 correction (PHASE_A_FINDINGS.md §2) showed 3D-Front v1's weakest
# decile of pairs sits at 0.069, ABOVE MID's median of 0.030 -- so v1 only ever
# presented strongly-coloured pairs, and the regime the test set actually lives in
# was absent from synthetic training. That is a plausible reason its saturated
# colour invariance (inv_gap 0.0013) never transferred.
#
# Lever 1 does the same thing to MID: it moves the training pair distribution from
# a 0.038 median to 0.098, i.e. AWAY from the 0.030 the test set sits at. By the
# argument above that is exactly the mistake v1 made.
#
# The reason it is still the right move: invariance is expected to generalise
# DOWNWARD. A model held invariant across a 0.098 colour change should also be
# invariant across a 0.030 one, because the weaker change is the easier case. The
# reverse does not hold, which is why training only on 0.030 (status quo) leaves
# the strong-change behaviour unconstrained -- and Cast_rel rises 1.42x exactly
# there. The `floor` term keeps weak pairs in the mix rather than abandoning them.
#
# This is an ASSUMPTION, not a measured fact, and it is the one most likely to be
# wrong. The readout tests it directly: if the HIGH/LOW ratio falls while the LOW
# tercile does not degrade, downward generalisation held. If the LOW tercile gets
# WORSE while HIGH improves, it did not, and the fix is to widen coverage (sample
# across the range) rather than shift the median upward.
#
# RISK
# ----
# Lever 2 is synthetic colour and therefore carries the same transfer risk that
# already sank the 3D-Front route: V17 saturates synthetic colour invariance
# (front3d val inv_gap 0.0013) without it reaching real-domain Cast_rel (0.421).
# Lever 1 is real measured signal and carries no such risk. If the arms disagree,
# a lever-1-only run is the follow-up, not more synthetic colour.
#
# LAUNCH:
#   INITIAL_RESUME=checkpoints/v17_34/checkpoint_iter_60000.pth \
#   INITIAL_SKIP_OPTIMIZER=1 VERSION=17.51 CUDA=1 bash scripts/train_resilient.sh

extends: '17_34'

train:
  lr: 2.0e-5
  use_cosine_lr: false
  reset_lr: false
  # MUST match v17_50 -- see the confound note there.
  skip_optimizer: true

  extend_iterations: 68000
  checkpoint_interval_iters: 1000
  val_interval_iters: 1000
  max_val_batches: 10

  # I/O-bound, not compute-bound: measured 2.29 s/it with GPU util oscillating
  # 0-39% while the loader decodes MID/Front3D EXRs and Hypersim HDF5, and CARI
  # doubles the forwards per step (batch 4 x grad_accum 8 at 512px = 16 fwd/bwd).
  # 24 cores at load ~13 and 77 GB free, so 4 -> 8 workers is headroom we have.
  # MUST stay identical across both arms or the A/B is confounded by throughput.
  num_workers: 8

data:
  # Lever 1: real measured colour signal, concentrated.
  mid_chroma_stratified_pairs: true
  mid_chroma_stratify_power: 2.0
  mid_chroma_stratify_floor: 0.05

  # Lever 2: calibrated synthetic lamp colour on the raw pair frame.
  mid_per_direction_tint: true
  mid_per_direction_tint_prob: 0.5
  mid_per_direction_tint_dirs: 1

# Checkpoints and TensorBoard logs are redirected OFF the quota'd filesystem.
# The first attempt at this run died at step 1999/8000 with
# "OSError: [Errno 122] Disk quota exceeded" raised from the TensorBoard writer
# thread, which propagated into the training loop and killed it. /home/khang sits
# on a per-user quota with only ~4-6 GB of headroom, while a run needs ~4.3 GB at
# peak (2 retained checkpoints of 1.43 GB plus the transient .tmp during a save).
# df reports 298 GB free on that mount, which is FILESYSTEM space and says nothing
# about the quota -- checking df was the mistake that let this happen.
# /tmp is a different filesystem with 334 GB free and no quota. The final
# checkpoint is copied back into checkpoints/v17_51/ afterwards (1.43 GB fits).
# This changes only WHERE files are written, not the training computation, so the
# A/B against v17_50 is unaffected.
paths:
  checkpoint_dir: '/tmp/claude-1036/-home-khang-IR-IID/d673ee8e-3d22-4990-a1e4-390c85742e82/scratchpad/phaseB_ckpt'
  log_dir: '/tmp/claude-1036/-home-khang-IR-IID/d673ee8e-3d22-4990-a1e4-390c85742e82/scratchpad/phaseB_logs'
