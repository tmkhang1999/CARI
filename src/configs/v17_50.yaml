# V17.50 -- Phase B CONTROL arm. Identical to v17_51 except the colour levers are OFF.
#
# PURPOSE
# -------
# Phase A measured that CARI does not move real-domain colour-dependence at all:
# splitting MID's 30 test scenes into terciles by their own illuminant chromaticity
# gap, Cast_rel rises from the low to the high tercile by 1.42x WITH CARI and 1.43x
# WITHOUT it (documents/evals/PHASE_A_FINDINGS.md §3). Meanwhile CD-IID is flat
# (1.02), RGB-X 0.90, Marigold-App 1.03.
#
# The hypothesis for why: MID's illuminants barely change colour. Per-scene median
# chromaticity gap is 0.021 and only 14% of pairs reach 0.08, so a uniform pair draw
# spends nearly every CARI step on direction/intensity change -- which is exactly the
# axis we DO win (C_mat) while the colour axis stays flat.
#
# Phase B tests whether that is fixable from the data side alone, with no
# architecture change. v17_51 turns on two levers; this file turns on neither, so the
# pair isolates them.
#
# THE CONFOUND THIS FILE EXISTS TO AVOID
# --------------------------------------
# Table A's colour axis is confounded: a silent fresh-Adam fallback gave the
# colour-ON rows ~1.85x the effective LR of the colour-OFF rows. load_checkpoint()
# catches a param-group mismatch, warns, and continues with a freshly initialised
# optimizer (src/train_v17.py:299-307) -- so an A/B can differ in optimizer state
# without anyone noticing.
#
# Both arms therefore set skip_optimizer: true. Fresh Adam in BOTH, symmetric by
# construction, rather than hoping both happen to load cleanly.
#
# LAUNCH (both arms from the same v17_34 60k checkpoint, same step budget):
#   INITIAL_RESUME=checkpoints/v17_34/checkpoint_iter_60000.pth \
#   INITIAL_SKIP_OPTIMIZER=1 VERSION=17.50 CUDA=0 bash scripts/train_resilient.sh
#
# READ OUT ON (not on the scene-averaged Cast_rel, which cannot resolve this):
#   python tests/eval/mid_colour_stratified.py        # HIGH/LOW tercile ratio
#   python tests/eval/build_arap_colour_subset.py     # ARAP-Colour, real colour range
# Success = the HIGH/LOW ratio falls toward 1.0, NOT merely a lower mean Cast_rel.

extends: '17_34'

train:
  lr: 2.0e-5
  use_cosine_lr: false
  reset_lr: false
  # Symmetric with v17_51 -- see the confound note above. Do not set to false on one
  # arm only; that reproduces the Table-A error exactly.
  skip_optimizer: true

  # 8k steps past v17_34's 60k. Short on purpose: this is a go/no-go read on whether
  # the colour axis responds to data at all, not a converged model.
  extend_iterations: 68000
  checkpoint_interval_iters: 1000
  val_interval_iters: 1000
  max_val_batches: 10

data:
  # Levers OFF -- this is the control. The remaining keys are stated explicitly
  # (rather than omitted) so a diff against v17_51 shows exactly two changed values
  # and nothing is left implicit.
  mid_chroma_stratified_pairs: false
  mid_chroma_stratify_power: 2.0
  mid_chroma_stratify_floor: 0.05
  mid_per_direction_tint: false
  mid_per_direction_tint_prob: 0.5
  mid_per_direction_tint_dirs: 1
