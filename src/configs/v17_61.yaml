# ============================================================================
# STUDY 1, ROW 1 of 4 -- CONTROL: no CARI cross-render loss at all.
# ============================================================================
#
# THE STUDY. Four rows, identical in every respect except the three CARI loss
# weights, all forked from ONE shared base (v17_60 @ 19k = end of phase 2):
#
#   row  config    L_inv   L_explain(lum)  L_chr_explain   question it answers
#   ---  --------  ------  --------------  -------------   -------------------
#    1   v17_61     0.0         0.0             0.0        does CARI do anything?
#    2   v17_62     0.5         0.25            0.0        the published CARI loss
#    3   v17_63     0.5         0.25            0.25       + the chroma half
#    4   v17_64     0.5         0.0             0.25       chroma INSTEAD of luminance
#
# (3 - 2) is the new contribution. (4 - 2) says which half of the explain
# constraint is actually carrying the effect. (2 - 1) reproduces the published
# ablation on the rebuilt base, which is what makes rows 3 and 4 legible against
# the existing thesis numbers.
#
# WHY THE STUDY IS BEING RUN AT ALL. Measured on the shipped model: only 47.9%
# of the inter-frame chroma change is explained by shading, and the UNPENALISED
# chroma residual (0.0741) is the same size as the PENALISED luminance one
# (0.0757). cari_explain reduces both ratios through lum(), so colour error is
# not down-weighted -- it is structurally invisible to the loss. L_inv does not
# cover the gap either: a constant albedo cast sits in its null space
# (midintrinsic_dataset.py:50). That is the mechanism behind Cast_rel 0.42 and
# the 1.42x colour-dependence CARI failed to move (1.42 vs 1.43 off).
#
# WHAT IS HELD FIXED ACROSS ALL FOUR ROWS
#   - base checkpoint: checkpoints/v17_60/checkpoint_iter_19000.pth
#   - data mix (below), including front3d v1 -- data is STUDY 2's axis, not this one
#   - the colour path: albedo_rgb_skip true, lambda_a_chroma 0.2 (from v17.yaml).
#     This was an ablation axis in the old Table A; here it is ON and constant so
#     the rows differ ONLY by the loss.
#   - LR schedule: inherited cosine, continuous across the fork (see v17_60.yaml)
#   - optimizer treatment: fresh Adam on the FIRST launch only, via
#     scripts/train_resilient.sh. The old Table A was invalidated because a silent
#     fresh-Adam fallback gave some rows ~1.85x the effective LR of others; the
#     launcher greps for that warning and aborts the row if it fires.
#   - NO refinement levers. The paper is scoped to CARI, so lambda_alb_flat_lf and
#     lambda_shadow_inv (the Table-B ladder, v17_34.yaml:63,68) stay absent.
#     Verified: v17.yaml does not define them, so `extends: '17'` cannot inherit them.
#
# ROW 1 SPECIFICALLY. With all three weights at 0 the cross-render block is
# skipped entirely and rgb2 is never forwarded, so this row is also ~2x faster
# per step than the others. That asymmetry is expected and does not confound
# anything -- throughput is not an input to any metric here.
#
# The chroma residual is still MEASURED in this row: with lambda_chr_explain at 0
# the trainer computes it under no_grad and logs it as CARI_chr_residual_diag
# (train_v17.py). So the quantity the study is about has a curve in every row,
# including the ones where it is not being optimised.
#
# LAUNCH:
#   INITIAL_RESUME=checkpoints/v17_60/checkpoint_iter_19000.pth \
#   VERSION=17.61 CUDA=0 bash scripts/train_resilient.sh
# ============================================================================

extends: '17'

train:
  # Fork sits at 19000 = phase2_iterations, so phase 3 (CARI) starts on step one.
  # Horizon 40000 matches the schedule the fork was trained under; see v17_60.yaml
  # for why the horizon must not be shortened to the stop step.
  extend_iterations: 40000

  # FALSE in-config, deliberately. --skip-optimizer is passed on the FIRST launch
  # only (Stage A -> Stage B, where the objective changes). An interrupted run
  # restarts with --auto-resume and NO flag, so it keeps its own optimizer state
  # instead of resetting Adam every time the job is killed. train_v17.py:1711 ORs
  # the CLI flag with this value, so false here is what makes that split possible.
  skip_optimizer: false

  # Only 1 iter checkpoint retained (+ checkpoint_latest.pth). Two concurrent rows on
  # the ~16 GB session scratchpad peak at 11.4 GB with the default 2, and that margin
  # is what killed both Round-1 rows at step 2000. Evaluation uses the FINAL checkpoint
  # only, so retaining intermediates buys nothing here.
  keep_checkpoints: 1
  checkpoint_interval_iters: 1000
  val_interval_iters: 2000
  max_val_batches: 10

  # Loader-bound, not compute-bound: 4 -> 8 workers took Phase B from 2.29 s/it
  # (GPU util 0-39%) to ~1.3 s/it. MUST stay identical across rows.
  num_workers: 8

  # TABLE-A MIX -- matches v17_41..44 exactly (hypersim 0.4 / mid 0.3 / IV 0.3).
  # NO front3d, deliberately.
  #
  # This was WRONG before: the mix had been copied from v17_34, which is the Table-B
  # REFINEMENT ladder, not Table A. Two things follow from that mistake, and both
  # break the study:
  #
  #  1. Row 62 exists to reproduce the PUBLISHED CARI loss so rows 63/64 are legible
  #     against the thesis numbers. Under a different data mix it reproduces nothing.
  #
  #  2. front3d is not merely extra data -- it is a CARI PAIR SOURCE
  #     (front3d_dataset.py: "synthetic replacement for the unavailable OpenRooms
  #     pairs... the illuminant COLOR axis is explicitly randomized"). It feeds rgb2,
  #     the same channel L_inv / L_explain / L_chr_explain read. And its colour gaps
  #     dwarf MID's: v1's p10 is 0.069, ABOVE MID's median of 0.030
  #     (PHASE_A_FINDINGS.md). Since L_chr_explain only fires on chromatic
  #     differences, nearly all of its gradient came from SYNTHETIC pairs with
  #     exaggerated colour changes rather than from real measured illuminants.
  #     That is a candidate cause of the measured desaturation (Chroma_fid -0.098),
  #     and it makes "does the chroma loss work on MID" unanswerable from those runs.
  #
  # front3d belongs on STUDY 2's data axis, which is where the runs that used it now
  # sit -- they are relabelled, not discarded.
  sampling_weights_phase3:
    hypersim: 0.4
    midintrinsic: 0.3
    interiorverse: 0.3


loss:
  # ROW 1 = CONTROL. All three cross-render terms off.
  lambda_alb_invariance: 0.0
  lambda_explain: 0.0
  lambda_chr_explain: 0.0

# STORAGE. Measured headroom, versus what df claims:
#     /home/khang   df says 298 G   real ~3 G   (per-user quota)
#     /tmp          df says 321 G   real ~16 G  (session cap)
# df is blind to both, and trusting it is what killed v17_51 at step 1999 with
# Errno 122 and BOTH Round-1 rows at step 2000 with exit 120 and no traceback.
# Runs write to /tmp because home cannot hold even one row's working set; the
# study's 18 finals (~26 GB) fit nowhere, so the workflow is evaluate-then-discard
# (keep the metrics JSON, free the weights). scripts/train_resilient.sh probes the
# filesystem for real before launching, and archives only when ARCHIVE=1.
paths:
  checkpoint_dir: '/tmp/claude-1036/-home-khang-IR-IID/d673ee8e-3d22-4990-a1e4-390c85742e82/scratchpad/cari_ckpt'
  log_dir: '/tmp/claude-1036/-home-khang-IR-IID/d673ee8e-3d22-4990-a1e4-390c85742e82/scratchpad/cari_logs'
