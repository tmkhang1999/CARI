# Colour study (3D-Front), control: resumes the base CIAI model (v17_44 at 40k) and trains
# 20k more steps on the same mix at a constant learning rate. Compare with v17_29.
extends: 17
train:
  lr: 2.0e-5
  use_cosine_lr: false
  reset_lr: false
  skip_optimizer: false
  extend_iterations: 60000
  checkpoint_interval_iters: 1000
  val_interval_iters: 2000
  sampling_weights_phase3:
    hypersim: 0.4
    midintrinsic: 0.3
    interiorverse: 0.3
