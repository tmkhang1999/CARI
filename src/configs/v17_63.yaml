# ============================================================================
# STUDY 1, ROW 3 of 4 -- THE PROPOSED LOSS: published CARI + the chroma half.
# ============================================================================
#
# See v17_61.yaml for the full study design and everything held fixed. This is
# the row the paper's contribution rests on; (3 - 2) is the headline contrast.
#
# WEIGHTS: L_inv 0.5, L_explain(lum) 0.25, L_chr_explain 0.25
#
# WHY 0.25, AND WHY IT IS NOT A GUESS. The two explain halves are set equal so
# they enter at the same scale, and the measurement says that is the right
# relative size: on the shipped model the unpenalised chroma residual is 0.0741
# and the penalised luminance residual is 0.0757 -- within 2% of each other. An
# earlier estimate of ~0.94 was derived from the ratio of the two INPUT
# residuals (3.76x) rather than the LOSS residuals, and was wrong for that
# reason; the loss-side quantities are what the weight has to balance.
#
# WHY THE TERM IS SPLIT FROM L_explain RATHER THAN MERGED INTO IT. Two reasons,
# and the second is the load-bearing one:
#   1. ABLATION. Merged, there is no way to attribute an effect to the chroma
#      constraint specifically -- row 4 could not exist.
#   2. ARITHMETIC. The log-residual decomposes orthogonally as r = m*(1,1,1) + c
#      with m = mean_c(r), so |r|^2 = 3m^2 + |c|^2. A merged per-channel L1 on
#      the raw 3-channel residual counts the achromatic part THREE times (once
#      per channel) against the chroma part's single contribution -- it is
#      dominated by the luminance signal it duplicates from L_explain. Removing
#      the channel mean first makes the two terms disjoint, so the weights
#      control genuinely separate quantities.
#   See cari_chr_explain() in src/losses/flexible_loss_v17.py for the derivation
#   and the note on why exact orthogonality is knowingly traded away (L_explain
#   is left byte-identical so rows carrying the old loss stay comparable).
#
# VERIFIED BEHAVIOUR before launch (synthetic probe, 4 cases):
#   colour change -> shading (correct)      L_explain 0.037   L_chr 0.002
#   colour change -> albedo   (the failure) L_explain 0.081   L_chr 0.697
#   intensity     -> albedo                 L_explain 0.509   L_chr 0.002
#   The old term separates the colour failure from the colour success by 2.2x;
#   the new one by 415x. And the chroma term correctly ignores pure intensity
#   error, confirming the split is real and not a relabelled luminance penalty.
#
# LAUNCH:
#   INITIAL_RESUME=checkpoints/v17_60/checkpoint_iter_19000.pth \
#   VERSION=17.63 CUDA=0 bash scripts/train_resilient.sh
# ============================================================================

extends: '17'

train:
  extend_iterations: 40000
  skip_optimizer: false          # see v17_61.yaml -- CLI flag on first launch only
  # Only 1 iter checkpoint retained (+ checkpoint_latest.pth). Two concurrent rows on
  # the ~16 GB session scratchpad peak at 11.4 GB with the default 2, and that margin
  # is what killed both Round-1 rows at step 2000. Evaluation uses the FINAL checkpoint
  # only, so retaining intermediates buys nothing here.
  keep_checkpoints: 1
  checkpoint_interval_iters: 1000
  val_interval_iters: 2000
  max_val_batches: 10
  num_workers: 8

  # TABLE-A MIX -- matches v17_41..44 exactly (hypersim 0.4 / mid 0.3 / IV 0.3).
  # NO front3d, deliberately.
  #
  # This was WRONG before: the mix had been copied from v17_34, which is the Table-B
  # REFINEMENT ladder, not Table A. Two things follow from that mistake, and both
  # break the study:
  #
  #  1. Row 62 exists to reproduce the PUBLISHED CARI loss so rows 63/64 are legible
  #     against the thesis numbers. Under a different data mix it reproduces nothing.
  #
  #  2. front3d is not merely extra data -- it is a CARI PAIR SOURCE
  #     (front3d_dataset.py: "synthetic replacement for the unavailable OpenRooms
  #     pairs... the illuminant COLOR axis is explicitly randomized"). It feeds rgb2,
  #     the same channel L_inv / L_explain / L_chr_explain read. And its colour gaps
  #     dwarf MID's: v1's p10 is 0.069, ABOVE MID's median of 0.030
  #     (PHASE_A_FINDINGS.md). Since L_chr_explain only fires on chromatic
  #     differences, nearly all of its gradient came from SYNTHETIC pairs with
  #     exaggerated colour changes rather than from real measured illuminants.
  #     That is a candidate cause of the measured desaturation (Chroma_fid -0.098),
  #     and it makes "does the chroma loss work on MID" unanswerable from those runs.
  #
  # front3d belongs on STUDY 2's data axis, which is where the runs that used it now
  # sit -- they are relabelled, not discarded.
  sampling_weights_phase3:
    hypersim: 0.4
    midintrinsic: 0.3
    interiorverse: 0.3


loss:
  # ROW 3 = published CARI + chroma explain. The proposed loss.
  lambda_alb_invariance: 0.5
  lambda_explain: 0.25
  lambda_chr_explain: 0.25

paths:
  checkpoint_dir: '/tmp/claude-1036/-home-khang-IR-IID/d673ee8e-3d22-4990-a1e4-390c85742e82/scratchpad/cari_ckpt'
  log_dir: '/tmp/claude-1036/-home-khang-IR-IID/d673ee8e-3d22-4990-a1e4-390c85742e82/scratchpad/cari_logs'
