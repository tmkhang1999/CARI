# Study 1: CIAI + chroma explanation loss on the three-channel shading.
# All four rows fork from the 19k Stage-A checkpoint of v17_60 and differ only in the
# three CIAI weights. Run each with --seed 42/43/44 for replicates.
extends: '17'
train:
  extend_iterations: 40000
  skip_optimizer: false        # pass --skip-optimizer on the first launch from 19k
  keep_checkpoints: 1
  checkpoint_interval_iters: 1000
  val_interval_iters: 2000
  max_val_batches: 10
  num_workers: 8
  sampling_weights_phase3:
    hypersim: 0.4
    midintrinsic: 0.3
    interiorverse: 0.3
loss:
  lambda_alb_invariance: 0.5
  lambda_explain: 0.25
  lambda_chr_explain: 0.25
