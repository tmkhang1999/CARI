# Shared defaults. Every experiment config extends rgb_shading.yaml (or sets its own values),
# which overrides most of these.

train:
  batch_size: 8
  num_workers: 4
  lr: 1.0e-5
  grad_accum_steps: 1
  grad_clip_max_norm: 1.0
  use_cosine_lr: true
  lr_eta_min: 1.0e-7
  log_interval: 50
  val_interval_iters: 2000
  checkpoint_interval_iters: 5000
  val_example_images: 3
  val_example_indices: [120, 200, 250]   # empty list = log the first val_example_images
  max_val_batches: null                  # null = full validation split
  compute_val_losses: true
  input_size: 384
  # Curriculum boundaries (global step); the data mix switches at each boundary.
  phase1_iterations: 20000
  phase2_iterations: 15000
  extend_iterations: 40000
  sampling_weights_phase1:
    hypersim: 1.0
    midintrinsic: 0.0
  sampling_weights_phase2:
    hypersim: 0.6
    midintrinsic: 0.4

model:
  arch: rgb_shading

data:
  hypersim_root: '../datasets/hypersim'
  midintrinsic_root: '../datasets/MID'
  # Per-worker decode caches (items). Small on purpose: each is RAM x workers x runs.
  cache_max_items: 64
  val_cache_max_items: 32
  val_num_workers: 2
  crop_mode_train: 'random'
  crop_mode_val: 'center'
  # Fixed scene-level Hypersim split
  hypersim_split_file: 'hypersim_split.json'
  hypersim_split_seed: 42
  hypersim_split_ratio: 0.9
  hypersim_strict_split: true
  hypersim_max_hdf5_retries: 1
  hypersim_skip_corrupt_samples: true

loss:
  lambda_msg: 0.5
  lambda_dssim: 0.4

paths:   # relative to the repository root
  checkpoint_dir: './checkpoints'
  log_dir: './logs'
  output_dir: './outputs'
