# Colour study (3D-Front): as v17_20, but with rendered 3D-Front-IID v1 coloured-light
# pairs in the mix. The trainer logs the cross-illumination albedo gap on held-out
# 3D-Front rooms (2. Val/3. Front3D/inv_gap).
extends: 17
train:
  lr: 2.0e-5
  use_cosine_lr: false
  reset_lr: false
  skip_optimizer: false
  extend_iterations: 60000
  checkpoint_interval_iters: 1000
  val_interval_iters: 2000
  sampling_weights_phase3:
    hypersim: 0.3
    midintrinsic: 0.3
    interiorverse: 0.15
    front3d: 0.25
data:
  front3d_root: '../datasets/front3d_iid'
